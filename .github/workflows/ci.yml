name: CI

on:
  push:
    branches: [main, refactor/v1-rebuild]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Lint + Security + Test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.14"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint with ruff
        run: ruff check app/
      - name: Security scan with bandit
        run: bandit -r app/ -ll
      - name: Run tests with pytest
        env:
          TVM_SECRET_KEY: test-key-for-ci
        run: pytest -q tests/

  frontend:
    name: Frontend (Type + Test + Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Type check with tsc
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Run tests with vitest
        working-directory: frontend
        run: npm test -- --run
        continue-on-error: true
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  security:
    name: Security (Trivy filesystem)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan (deps + misconfig + secrets)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-dirs: .venv,frontend/node_modules,data,media

  docker:
    name: Docker (Build + Scan + Smoke)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          load: true
          tags: tvm:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: image
          image-ref: tvm:test
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Smoke test (container start + health)
        run: |
          docker run -d \
            -e TVM_SECRET_KEY=test-key-for-ci \
            -e TVM_APP_PASSWORD=test \
            -p 8000:8000 \
            --name tvm-test \
            tvm:test
          for i in $(seq 1 15); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/health)" = "200" ] && { echo "healthy after ${i}s"; exit 0; }
            sleep 1
          done
          echo "health check failed"; docker logs tvm-test; exit 1
      - name: Cleanup
        if: always()
        run: docker stop tvm-test || true

  version:
    name: Semantic Release (version + changelog)
    runs-on: ubuntu-latest
    needs: [docker, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write        # commit the bump + CHANGELOG, tag, create release
    outputs:
      released: ${{ steps.psr.outputs.released }}
      version: ${{ steps.psr.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # PSR needs full history + tags to parse commits
      - name: Python Semantic Release
        id: psr
        uses: python-semantic-release/python-semantic-release@v9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Release (Push image)
    runs-on: ubuntu-latest
    needs: [version]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main           # build the post-bump tree so __version__ is current
      - name: Compute image tags
        id: tags
        env:
          RELEASED: ${{ needs.version.outputs.released }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          IMG="ghcr.io/${GITHUB_REPOSITORY,,}"   # GHCR requires lowercase
          TAGS="${IMG}:main"                      # rolling tag every main push
          if [ "$RELEASED" = "true" ]; then
            TAGS="${TAGS},${IMG}:${VERSION},${IMG}:${VERSION%.*},${IMG}:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
